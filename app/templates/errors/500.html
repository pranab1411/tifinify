{% extends "base.html" %}

{% block title %}Internal Server Error (500) | Tifinify{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
  <span class="display-1 text-warning fw-bold d-block mb-2">500</span>
  <h2 class="fw-bold text-dark mb-2">Something Went Wrong</h2>
  <p class="text-muted small mb-4">We encountered an internal processing issue. Please try again shortly.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-success fw-semibold px-4">
    <i class="bi bi-arrow-clockwise me-1"></i> Back to Home
  </a>
</div>
{% endblock %}
