{% extends "base.html" %}

{% block title %}Access Denied (403) | Tifinify{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
  <span class="display-1 text-danger fw-bold d-block mb-2">403</span>
  <h2 class="fw-bold text-dark mb-2">Access Forbidden</h2>
  <p class="text-muted small mb-4">You do not have administrative clearance to access this portal.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary fw-semibold px-4">
    <i class="bi bi-arrow-left me-1"></i> Return to Safety
  </a>
</div>
{% endblock %}
